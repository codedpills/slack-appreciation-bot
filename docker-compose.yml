version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: slack-appreciation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appreciation
      POSTGRES_PASSWORD: appreciation
      POSTGRES_DB: appreciation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
